name: nyaya-backend

# ── Prod overrides ────────────────────────────────────────────────────────────
# Extends docker-compose.base.yml.
# Adds: app (FastAPI) + caddy (reverse proxy / TLS).
# Postgres and Redis are inherited from base with no exposed ports.

services:

  caddy:
    image: caddy:2-alpine
    container_name: nyaya-caddy
    restart: unless-stopped
    ports:
      - "80:80"           # HTTP (redirected to HTTPS automatically)
      - "443:443"         # HTTPS
      - "443:443/udp"     # HTTP/3 (QUIC)
    env_file:
      - ../.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # TLS certificates — never delete in prod
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend

  app:
    # `image` doubles as the tag when building locally (make build/prod)
    # and as the pull source when deploying from a registry (make prod-update).
    image: ${DOCKER_IMAGE:-nyaya-app:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: nyaya-app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # Override so the app reaches sibling containers, not localhost
      DB_HOST:    postgres
      REDIS_HOST: redis
    expose:
      - "${APP_PORT:-8000}"
    # No `command`: entrypoint.sh handles migrations + fastapi run
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:${APP_PORT:-8000}/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
  
  worker:
    image: ${DOCKER_IMAGE:-nyaya-app:latest}
    container_name: nyaya-worker
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DB_HOST:    postgres
      REDIS_HOST: redis
    command: taskiq worker app.core.config.broker:broker app.background.tasks
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

volumes:
  caddy_data:     # TLS certs — never delete this in prod
  caddy_config:
  caddy_logs:
