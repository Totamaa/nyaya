name: nyaya-backend

# ── Dev overrides ─────────────────────────────────────────────────────────────
# Extends docker-compose.base.yml.
# Only adds host-accessible ports so you can inspect DB/Redis directly.
# The FastAPI app runs locally via `make dev`, not in Docker.

services:

  postgres:
    ports:
      - "${DB_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"
